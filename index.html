<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社团资源库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandTitle" title="返回最近更新">📚 社团资源库</button>
    <div class="search-wrap" id="searchWrap">
      <input type="search" id="globalSearch" placeholder="搜索文件名…" autocomplete="off">
      <div class="search-panel hidden" id="searchPanel"></div>
    </div>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-seg" id="modeUpload" data-mode="upload" type="button">上传</button>
      <button class="mode-seg active" id="modeDownload" data-mode="download" type="button">下载</button>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="treeToggle" hidden>☰ 目录</button>
      <button class="btn ghost" id="logoutBtn" hidden>退出登录</button>
    </div>
  </header>

  <main class="container">
    <!-- 登录界面：没有密码看不到任何数据 -->
    <section id="loginView" class="login-wrap" hidden>
      <form id="loginForm" class="login-card" novalidate>
        <h1>📚 社团资源库</h1>
        <p class="login-hint">请输入社团共享的 Koofr 邮箱与应用密码</p>
        <label class="field">
          <span>邮箱</span>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="club@example.com" required>
        </label>
        <label class="field">
          <span>应用密码</span>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入应用密码" required>
        </label>
        <p id="loginError" class="login-error" hidden></p>
        <button id="loginBtn" type="submit" class="btn primary block">进入资源库</button>
        <p class="login-foot">密码只保留在当前页面内，刷新或关闭页面后需重新登录</p>
      </form>
    </section>

    <!-- 主界面 -->
    <section id="mainView" hidden>
      <div id="banner" class="banner" hidden><span id="bannerText"></span></div>
      <div class="layout">
        <div id="sidebarMask" class="sidebar-mask" hidden></div>
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head"><span>📂 目录</span></div>
          <nav id="tree" class="tree" aria-label="目录树"></nav>
        </aside>
        <main class="content-pane">
          <!-- 上传面板：登录后常驻，可切换/新建目标文件夹 -->
          <div id="uploadArea" class="upload-area" hidden>
            <div class="upload-toolbar">
              <label class="folder-pick">
                <span>上传到：</span>
                <select id="folderSelect"></select>
              </label>
              <button class="btn small" id="newFolderBtn">＋ 新建文件夹</button>
            </div>
            <div id="uploadZone" class="upload-zone" role="button" tabindex="0">
              <span>⬆️ 拖拽文件到此处，或点击选择文件（可多选）</span>
              <input id="fileInput" type="file" multiple hidden>
            </div>
            <div id="uploadQueue" class="upload-queue" hidden></div>
          </div>

          <nav id="breadcrumb" class="breadcrumb" aria-label="路径"></nav>
          <div id="content" class="content"></div>
        </main>
      </div>
    </section>
  </main>

  <div id="modalRoot"></div>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
