<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社团资源库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235E6AD2'/><rect x='17' y='20' width='66' height='16' rx='5' fill='%23FFFFFF'/><rect x='17' y='42' width='66' height='16' rx='5' fill='%23FFFFFF' opacity='.85'/><rect x='17' y='64' width='66' height='16' rx='5' fill='%23FFFFFF' opacity='.7'/></svg>">
  <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandTitle" title="返回最近更新">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="4" width="17" height="5" rx="1.5"></rect><rect x="3.5" y="9.5" width="17" height="5" rx="1.5"></rect><rect x="3.5" y="15" width="17" height="5" rx="1.5"></rect></svg>
      <span id="brandText">社团资源库</span>
    </button>
    <button class="search-icon" type="button" aria-label="搜索" title="搜索">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6"></circle><path d="M20.5 20.5L15.5 15.5"></path></svg>
    </button>
    <div class="search-wrap" id="searchWrap">
      <div class="scope-picker" id="scopePicker">
        <button class="scope-trigger" id="scopeTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" title="搜索范围">
          <span id="scopeLabel">全部</span>
          <svg class="ico scope-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.5 9L12 15.5 18.5 9"></path></svg>
        </button>
        <div class="scope-menu hidden" id="scopeMenu" role="listbox" aria-label="搜索范围">
          <button class="scope-option active" type="button" data-scope="all" role="option" aria-selected="true"><span>全部</span><svg class="ico scope-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
          <button class="scope-option" type="button" data-scope="file" role="option" aria-selected="false"><span>文件名</span><svg class="ico scope-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
          <button class="scope-option" type="button" data-scope="folder" role="option" aria-selected="false"><span>文件夹名</span><svg class="ico scope-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
          <button class="scope-option" type="button" data-scope="type" role="option" aria-selected="false"><span>文件类型</span><svg class="ico scope-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
        </div>
        <select id="searchScope" class="scope-native" aria-hidden="true" tabindex="-1" title="搜索范围">
          <option value="all">全部</option>
          <option value="file">文件名</option>
          <option value="folder">文件夹名</option>
          <option value="type">文件类型</option>
        </select>
      </div>
      <button class="search-close" type="button" aria-label="收起搜索" title="收起搜索">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <input type="search" id="globalSearch" placeholder="搜索文件名…" autocomplete="off">
      <div class="search-panel hidden" id="searchPanel"></div>
    </div>
    <button class="btn ghost" id="guideBtn" hidden>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4.5L2.5 9.5 12 14.5l9.5-5L12 4.5z"></path><path d="M6 12v4c0 1.5 2.7 2.8 6 2.8s6-1.3 6-2.8v-4"></path><path d="M21.5 9.5v5"></path></svg>
      <span>教学</span>
    </button>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-seg" id="modeUpload" data-mode="upload" type="button">上传</button>
      <button class="mode-seg active" id="modeDownload" data-mode="download" type="button">下载</button>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="treeToggle" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6.5h16M4 12h16M4 17.5h16"></path></svg>
        <span>目录</span>
      </button>
      <button class="btn ghost" id="logoutBtn" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 4H6.5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1H14"></path><path d="M17 8.5l3.5 3.5-3.5 3.5"></path><path d="M20.5 12H10"></path></svg>
        <span>退出登录</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- 登录界面：没有密码看不到任何数据 -->
    <section id="loginView" class="login-wrap" hidden>
      <form id="loginForm" class="login-card" novalidate>
        <h1>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="4" width="17" height="5" rx="1.5"></rect><rect x="3.5" y="9.5" width="17" height="5" rx="1.5"></rect><rect x="3.5" y="15" width="17" height="5" rx="1.5"></rect></svg>
          <span>社团资源库</span>
        </h1>
        <p class="login-hint">请输入社团共享的 Koofr 邮箱与应用密码</p>
        <label class="field">
          <span>邮箱</span>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="club@example.com" required>
        </label>
        <label class="field">
          <span>应用密码</span>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入应用密码" required>
        </label>
        <p id="loginError" class="login-error" hidden></p>
        <button id="loginBtn" type="submit" class="btn primary block">进入资源库</button>
        <p class="login-foot">密码只保留在当前页面内，刷新或关闭页面后需重新登录</p>
      </form>
    </section>

    <!-- 主界面 -->
    <section id="mainView" hidden>
      <!-- 状态栏：显示提示信息与下载进度（原横幅位置） -->
      <div id="statusBar" class="status-bar">
        <span id="statusText">状态栏：当前为空</span>
        <div class="status-progress" id="statusProgress" hidden>
          <div class="progress"><div class="progress-bar" id="statusProgressBar"></div></div>
        </div>
      </div>
      <div class="layout">
        <div id="sidebarMask" class="sidebar-mask" hidden></div>
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2h7A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10z"></path></svg>
            <span>目录</span>
          </div>
          <nav id="tree" class="tree" aria-label="目录树"></nav>
        </aside>
        <main class="content-pane">
          <!-- 上传面板：登录后常驻，可切换/新建目标文件夹 -->
          <div id="uploadArea" class="upload-area" hidden>
            <div class="upload-toolbar">
              <label class="folder-pick">
                <span>上传到：</span>
                <select id="folderSelect"></select>
              </label>
              <button class="btn small" id="newFolderBtn">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg>
                <span>新建文件夹</span>
              </button>
            </div>
            <div id="uploadZone" class="upload-zone" role="button" tabindex="0">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 14V4M8 8l4-4 4 4"></path><path d="M4.5 20h15"></path></svg>
              <span>点击或拖拽皆可</span>
              <input id="fileInput" type="file" multiple hidden>
            </div>
            <div id="uploadQueue" class="upload-queue" hidden></div>
          </div>

          <nav id="breadcrumb" class="breadcrumb" aria-label="路径"></nav>
          <div id="content" class="content"></div>
        </main>
      </div>
    </section>
  </main>

  <!-- 批量操作栏（下载模式选择文件后出现） -->
  <div id="batchBar" class="batch-bar hidden">
    <span>已选择 <b id="batchCount">0</b> 项</span>
    <button class="btn" id="batchDownloadBtn">批量下载</button>
    <button class="btn" id="batchClearBtn">取消选择</button>
  </div>

  <div id="modalRoot"></div>

  <script src="js/config.js?v=31"></script>
  <script src="js/pinyin.js?v=31"></script>
  <script src="js/jszip.js?v=31"></script>
  <script src="js/docx-preview.js?v=31"></script>
  <script src="js/xlsx.js?v=31"></script>
  <script src="js/api.js?v=31"></script>
  <script src="js/search.js?v=31"></script>
  <script src="js/preview.js?v=36"></script>
  <script src="js/guide.js?v=31"></script>
  <script src="js/app.js?v=32"></script>
</body>
</html>
